name: Deploy Node.js service to AWS Web App - dockerized-server

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: node-service
  APP_USER: ${{ secrets.USER }}
  APP_PASSWORD: ${{ secrets.PASSWORD }}


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

       # 2. Autenticarse en AWS mediante OIDC
        - name: Configure AWS credentials   
          uses: aws-actions/configure-aws-credentials@v4 
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: us-east-2

      # 3. Login en ECR
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2    

      # 4. Construir imagen
      
        - name: Build Docker image
          run: |
            docker build -t node-service:alpine .
        - name: Tag Docker image
          run: |
            docker tag node-service:alpine ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:alpine
      # 5. Push a ECR

        - name: Push Docker image to Amazon ECR
          run: |
            docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:alpine

      # 6. Conectarse a EC2
      # ...
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.2  
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |

              echo "APP_USER está definido: ${APP_USER:+si}"
              echo "APP_PASSWORD está definido: ${APP_PASSWORD:+si}"

              docker pull ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:alpine
              docker stop node-service || true
              docker rm node-service || true
              docker run -d \
              --name node-service \
              -e APP_USER="$APP_USER" \
              -e APP_PASSWORD="$APP_PASSWORD" \
              -p 3000:3000 \
              ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:alpine